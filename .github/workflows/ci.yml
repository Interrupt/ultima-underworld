name: CI

on:
  # Pushes to main only: other branches are built by pull_request (a branch with an open PR would
  # otherwise run twice). Version tags are handled by release.yml, which reuses this workflow.
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  # Unit tests, which run against synthetic game data (data/ is not in the repo; see
  # tests/unit-cases.txt). The suite builds with CMake.
  unit-tests:
    name: Unit tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          # ARM Linux has unsigned plain char; this catches code that assumes it is signed (see -fsigned-char).
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm, os: macos-latest }
          - { name: macos-x86_64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libsdl2-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config sdl2
      - name: Run unit tests
        run: ./run-unit-tests.sh

  # Game executables built with build.zig, one per platform.
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux links the system SDL2 (needs libsdl2 installed to run).
          - { name: linux-x86_64, os: ubuntu-latest, args: "" }
          # Windows is cross-compiled; SDL2 is built from source and linked statically.
          - { name: windows-x86_64, os: ubuntu-latest, args: "-Dtarget=x86_64-windows-gnu -Dsystem-sdl=false" }
          # macOS Apple silicon with SDL2 built from source, so no Homebrew dylib is needed to run.
          - { name: macos-arm64, os: macos-latest, args: "-Dsystem-sdl=false" }
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install SDL2 (Linux)
        if: matrix.name == 'linux-x86_64'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        run: zig build -Dwerror=true ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: uw_dbg-${{ matrix.name }}
          path: zig-out/bin/
          if-no-files-found: error

  # Launch the cross-built Windows executable on a real Windows runner. It needs no game data to
  # print its help, so this proves the binary starts (SDL2 is linked statically).
  windows-smoke:
    name: Run (windows-x86_64)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: uw_dbg-windows-x86_64
          path: bin
      - name: Print help
        shell: pwsh
        run: |
          $out = & .\bin\uw_dbg.exe --help
          if ($LASTEXITCODE -ne 0) { throw "uw_dbg.exe --help exited with $LASTEXITCODE" }
          $out | Select-Object -First 5
