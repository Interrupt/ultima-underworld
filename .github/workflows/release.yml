name: Release

# Publish a GitHub Release (web UI, or gh release create v1.0.0) to build every platform and
# attach one zip per platform to it: the executable plus the README. Any tag name works.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Run the full CI (unit tests and all three builds) first; its build artifacts are packaged below.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: uw_dbg-*
          path: artifacts
      - name: Package
        run: |
          mkdir dist
          for dir in artifacts/uw_dbg-*; do
            platform="${dir#artifacts/uw_dbg-}"
            name="uw1-pocketpc-decomp-${GITHUB_REF_NAME}-${platform}"
            mkdir -p "stage/$name"
            # Executable only (no debug symbols), plus the README.
            find "$dir" -maxdepth 1 -type f ! -name '*.pdb' -exec cp {} "stage/$name/" \;
            cp README.md "stage/$name/"
            chmod +x "stage/$name"/uw_dbg* 2>/dev/null || true
            (cd stage && zip -r "../dist/$name.zip" "$name")
          done
          ls -l dist
      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
